name: Profile metrics

on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Contribution + language metrics (private included via PAT)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PROFILE_TOKEN }}
          user: Vinayak0090
          filename: assets/metrics.svg
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_order: isocalendar, languages
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          commits_authoring: Vinayak Gandhi, vinayak.gandhi.in@gmail.com, Vinayak0090
