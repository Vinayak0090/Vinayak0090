<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 240" width="1200" height="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Vinayak Gandhi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/><stop offset="55%" stop-color="#0d1117"/><stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#9db4d8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="aur1" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <radialGradient id="aur2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="node" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a5f3fc"/><stop offset="100%" stop-color="#06b6d4"/></radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1b2741"/></pattern>
    <path id="e1" d="M 985 120 L 855 60"/><path id="e2" d="M 985 120 L 1000 48"/><path id="e3" d="M 985 120 L 1118 85"/>
    <path id="e4" d="M 985 120 L 905 188"/><path id="e5" d="M 985 120 L 1058 190"/><path id="e6" d="M 855 60 L 1000 48"/>
  </defs>

  <rect width="1200" height="240" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="240" rx="14" fill="url(#dots)" opacity="0.6"/>
  <g><circle cx="300" cy="110" r="210" fill="url(#aur1)" filter="url(#soft)"><animate attributeName="cx" values="300;370;300" dur="16s" repeatCount="indefinite"/></circle>
     <circle cx="980" cy="150" r="230" fill="url(#aur2)" filter="url(#soft)"><animate attributeName="cy" values="150;90;150" dur="20s" repeatCount="indefinite"/></circle></g>
  <rect x="0" y="0" width="1200" height="2" fill="url(#accent)" opacity="0.5"/>
  <rect x="0" y="238" width="1200" height="2" fill="url(#accent)" opacity="0.3"/>

  <!-- edge network -->
  <g stroke="#1f3a52" stroke-width="1.3" opacity="0.85">
    <line x1="985" y1="120" x2="855" y2="60"/><line x1="985" y1="120" x2="1000" y2="48"/><line x1="985" y1="120" x2="1118" y2="85"/>
    <line x1="985" y1="120" x2="905" y2="188"/><line x1="985" y1="120" x2="1058" y2="190"/><line x1="855" y1="60" x2="1000" y2="48"/>
  </g>
  <g fill="#67e8f9">
    <circle r="2.8"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath xlink:href="#e1"/></animateMotion></circle>
    <circle r="2.8"><animateMotion dur="3.1s" begin="0.4s" repeatCount="indefinite"><mpath xlink:href="#e2"/></animateMotion></circle>
    <circle r="2.8"><animateMotion dur="2.9s" begin="0.9s" repeatCount="indefinite"><mpath xlink:href="#e3"/></animateMotion></circle>
    <circle r="2.8"><animateMotion dur="3.4s" begin="0.2s" repeatCount="indefinite"><mpath xlink:href="#e4"/></animateMotion></circle>
    <circle r="2.8"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath xlink:href="#e5"/></animateMotion></circle>
    <circle r="2.2" fill="#a5b4fc"><animateMotion dur="3.8s" begin="0.6s" repeatCount="indefinite"><mpath xlink:href="#e6"/></animateMotion></circle>
  </g>
  <g>
    <circle cx="855" cy="60" r="4.5" fill="url(#node)"/><circle cx="1000" cy="48" r="4.5" fill="url(#node)"/><circle cx="1118" cy="85" r="4.5" fill="url(#node)"/>
    <circle cx="905" cy="188" r="4.5" fill="url(#node)"/><circle cx="1058" cy="190" r="4.5" fill="url(#node)"/>
    <circle cx="985" cy="120" r="8" fill="url(#node)" filter="url(#glow)"><animate attributeName="r" values="7;10;7" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="985" cy="120" r="8" fill="none" stroke="#06b6d4" stroke-width="1.4" opacity="0.55"><animate attributeName="r" values="8;24;8" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.55;0;0.55" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- name only -->
  <g transform="translate(72,0)">
    <text x="0" y="128" fill="url(#title)" font-size="62" font-weight="800" letter-spacing="-1.2" filter="url(#glow)" opacity="1">Vinayak Gandhi
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.8s" fill="freeze"/></text>
    <rect x="2" y="150" height="4" rx="2" fill="url(#accent)" width="230"><animate attributeName="width" from="0" to="230" begin="0.6s" dur="0.7s" fill="freeze"/></rect>
    <text x="2" y="190" fill="#64748b" font-size="15" font-style="italic" opacity="1">quiet infrastructure for an intelligent age
      <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.8s" fill="freeze"/></text>
  </g>
</svg>
