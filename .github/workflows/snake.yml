name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # manual run button

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Generate snake SVGs (private contributions via PAT)
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PROFILE_TOKEN }}
          outputs: |
            dist/snake.svg?color_snake=#06b6d4&color_dots=#dbeafe,#bae6fd,#67e8f9,#22d3ee,#06b6d4
            dist/snake-dark.svg?palette=github-dark&color_snake=#06b6d4&color_dots=#0d1117,#164e63,#0891b2,#22d3ee,#67e8f9

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
