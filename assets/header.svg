<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 340" width="1200" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Vinayak Gandhi, Founder &amp; Engineer at Flickerlink Technologies">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9db4d8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="aur1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aur2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#1e2b47"/>
    </pattern>
    <!-- edge paths for travelling packets -->
    <path id="e1" d="M 985 165 L 855 95"/>
    <path id="e2" d="M 985 165 L 1000 72"/>
    <path id="e3" d="M 985 165 L 1118 118"/>
    <path id="e4" d="M 985 165 L 905 250"/>
    <path id="e5" d="M 985 165 L 1058 252"/>
    <path id="e6" d="M 855 95 L 1000 72"/>
    <path id="e7" d="M 905 250 L 1058 252"/>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="340" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="16" fill="url(#dots)" opacity="0.6"/>

  <!-- drifting aurora -->
  <g opacity="0.9">
    <circle cx="280" cy="120" r="240" fill="url(#aur1)" filter="url(#soft)">
      <animate attributeName="cx" values="280;360;280" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="120;180;120" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="230" r="260" fill="url(#aur2)" filter="url(#soft)">
      <animate attributeName="cx" values="1000;920;1000" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="230;160;230" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- top + bottom hairlines -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#accent)" opacity="0.55"/>
  <rect x="0" y="338" width="1200" height="2" fill="url(#accent)" opacity="0.35"/>

  <!-- ===== edge-network topology (right) ===== -->
  <g stroke="#1f3a52" stroke-width="1.4" opacity="0.85">
    <line x1="985" y1="165" x2="855" y2="95"/>
    <line x1="985" y1="165" x2="1000" y2="72"/>
    <line x1="985" y1="165" x2="1118" y2="118"/>
    <line x1="985" y1="165" x2="905" y2="250"/>
    <line x1="985" y1="165" x2="1058" y2="252"/>
    <line x1="855" y1="95" x2="1000" y2="72"/>
    <line x1="905" y1="250" x2="1058" y2="252"/>
  </g>

  <!-- travelling packets -->
  <g fill="#67e8f9">
    <circle r="3"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath xlink:href="#e1"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="3.1s" begin="0.4s" repeatCount="indefinite"><mpath xlink:href="#e2"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.9s" begin="0.9s" repeatCount="indefinite"><mpath xlink:href="#e3"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="3.4s" begin="0.2s" repeatCount="indefinite"><mpath xlink:href="#e4"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath xlink:href="#e5"/></animateMotion></circle>
    <circle r="2.4" fill="#a5b4fc"><animateMotion dur="3.8s" begin="0.6s" repeatCount="indefinite"><mpath xlink:href="#e6"/></animateMotion></circle>
    <circle r="2.4" fill="#a5b4fc"><animateMotion dur="3.5s" begin="1.6s" repeatCount="indefinite"><mpath xlink:href="#e7"/></animateMotion></circle>
  </g>

  <!-- nodes -->
  <g>
    <circle cx="855" cy="95" r="5" fill="url(#node)"/>
    <circle cx="1000" cy="72" r="5" fill="url(#node)"/>
    <circle cx="1118" cy="118" r="5" fill="url(#node)"/>
    <circle cx="905" cy="250" r="5" fill="url(#node)"/>
    <circle cx="1058" cy="252" r="5" fill="url(#node)"/>
    <!-- central hub -->
    <circle cx="985" cy="165" r="9" fill="url(#node)" filter="url(#glow)">
      <animate attributeName="r" values="8;11;8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="985" cy="165" r="9" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="9;26;9" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== title block (left) ===== -->
  <g transform="translate(72, 0)">
    <!-- status label -->
    <g opacity="1">
      <circle cx="6" cy="86" r="5" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="22" y="91" fill="#7d8db0" font-size="14" font-weight="600" letter-spacing="4">FLICKERLINK TECHNOLOGIES</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.7s" fill="freeze"/>
    </g>

    <!-- name -->
    <text x="0" y="178" fill="url(#title)" font-size="68" font-weight="800" letter-spacing="-1" filter="url(#glow)" opacity="1">Vinayak Gandhi
      <animate attributeName="opacity" from="0" to="1" begin="0.35s" dur="0.8s" fill="freeze"/>
    </text>

    <!-- accent underline -->
    <rect x="2" y="198" height="4" rx="2" fill="url(#accent)" width="262">
      <animate attributeName="width" from="0" to="262" begin="0.7s" dur="0.7s" fill="freeze"/>
    </rect>

    <!-- subtitle -->
    <text x="2" y="238" fill="#cbd5e1" font-size="22" font-weight="600" opacity="1">Founder &amp; Engineer &#183; Cloud Infrastructure
      <animate attributeName="opacity" from="0" to="1" begin="0.85s" dur="0.8s" fill="freeze"/>
    </text>

    <!-- tagline -->
    <text x="2" y="272" fill="#64748b" font-size="15.5" font-style="italic" opacity="1">Quiet infrastructure for an intelligent age.
      <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.8s" fill="freeze"/>
    </text>
  </g>
</svg>
