<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Built quietly. Supported obsessively.">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="facc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fdots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#16223b"/>
    </pattern>
  </defs>

  <rect width="1200" height="130" fill="url(#fbg)"/>
  <rect width="1200" height="130" fill="url(#fdots)" opacity="0.5"/>

  <!-- animated accent line -->
  <rect x="0" y="40" width="1200" height="2" fill="url(#facc)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- pulsing node markers along the line -->
  <g fill="#06b6d4">
    <circle cx="360" cy="41" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="41" r="3.5"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="41" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="86" text-anchor="middle" fill="#94a3b8" font-size="17" font-weight="600" letter-spacing="1">Built quietly. Supported obsessively.</text>
  <text x="600" y="110" text-anchor="middle" fill="#475569" font-size="12.5" letter-spacing="3">FLICKERLINK&#160;TECHNOLOGIES&#160;&#183;&#160;CLOUDUXE&#160;&#183;&#160;FIVEUXE</text>
</svg>
